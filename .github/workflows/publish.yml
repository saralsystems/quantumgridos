name: Publish to PyPI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - 'demos/**'
      - '.github/**'
      - '.gitignore'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Get full history for version info

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Extract version from setup.py
      id: get_version
      run: |
        VERSION=$(python -c "import re; content = open('setup.py').read(); print(re.search(r'version=\"([^\"]+)\"', content).group(1))")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Package version: $VERSION"

    - name: Check if version exists on PyPI
      id: check_version
      run: |
        PACKAGE_NAME="quantumgridos"
        VERSION="${{ steps.get_version.outputs.version }}"

        # Check if this version already exists on PyPI
        if pip index versions $PACKAGE_NAME 2>/dev/null | grep -q "$VERSION"; then
          echo "Version $VERSION already exists on PyPI"
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "Version $VERSION does not exist on PyPI - will publish"
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Build package
      if: steps.check_version.outputs.exists == 'false'
      run: |
        python -m build
        ls -lh dist/

    - name: Check package with twine
      if: steps.check_version.outputs.exists == 'false'
      run: |
        python -m twine check dist/*

    - name: Publish to PyPI
      if: steps.check_version.outputs.exists == 'false'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python -m twine upload dist/* --verbose

    - name: Create GitHub Release
      if: steps.check_version.outputs.exists == 'false'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        release_name: Release v${{ steps.get_version.outputs.version }}
        body: |
          ## QuantumGridOS v${{ steps.get_version.outputs.version }}

          This release has been automatically published to PyPI.

          Install with: `pip install quantumgridos==${{ steps.get_version.outputs.version }}`

          See [CHANGELOG.md](https://github.com/saralsystems/quantumgridos/blob/main/CHANGELOG.md) for details.
        draft: false
        prerelease: false

    - name: Skip publish (version exists)
      if: steps.check_version.outputs.exists == 'true'
      run: |
        echo "⚠️ Version ${{ steps.get_version.outputs.version }} already exists on PyPI"
        echo "To publish a new version, update the version number in setup.py and pyproject.toml"
